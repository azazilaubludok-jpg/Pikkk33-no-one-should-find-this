<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Стенка</title>
<meta name="description" content="Анонимная стена: пиши что хочешь, видят все.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  /* Layout: one narrow column — composer on top, the wall below, newest first. */
  :root {
    --bg: #e9ebe8;        /* бетон */
    --surface: #f7f8f6;
    --ink: #1d1f1c;
    --muted: #686c66;
    --line: #cfd2cc;
    --mark: #f2e14a;      /* маркер-выделитель */
    --mark-ink: #1d1f1c;
    --danger: #b3261e;
    --display: "Unbounded", "Arial Black", system-ui, sans-serif;
    --body: "Golos Text", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #161816; --surface: #1f221f; --ink: #e8eae6; --muted: #9a9f97;
      --line: #333731; --mark: #e6d43c; --mark-ink: #161816; --danger: #f2877f;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #161816; --surface: #1f221f; --ink: #e8eae6; --muted: #9a9f97;
    --line: #333731; --mark: #e6d43c; --mark-ink: #161816; --danger: #f2877f;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.5 var(--body);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 32px 64px;
  }
  .wrap { max-width: 640px; margin: 0 auto; display: grid; gap: 28px; }

  header { display: grid; gap: 6px; }
  h1 {
    margin: 0; font: 800 clamp(40px, 11vw, 72px)/0.95 var(--display);
    letter-spacing: -0.02em; text-wrap: balance;
  }
  h1 span { background: linear-gradient(transparent 55%, var(--mark) 55%, var(--mark) 92%, transparent 92%); padding: 0 .08em; }
  .tagline { margin: 0; color: var(--muted); }
  .stats { font: 500 12px/1 var(--mono); color: var(--muted); letter-spacing: .06em; text-transform: uppercase; font-variant-numeric: tabular-nums; }

  form {
    background: var(--surface); border: 1px solid var(--line); border-radius: 6px;
    padding: 14px; display: grid; gap: 10px;
  }
  label.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  input, textarea {
    width: 100%; font: inherit; color: var(--ink); background: transparent;
    border: 0; border-bottom: 1px solid var(--line); padding: 6px 2px; outline: none;
  }
  input:focus-visible, textarea:focus-visible { border-bottom-color: var(--ink); }
  #nick { font: 500 14px/1.4 var(--mono); max-width: 240px; }
  textarea { resize: vertical; min-height: 88px; border-bottom: 0; font-size: 17px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .count { font: 12px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
  .count.over { color: var(--danger); }
  button {
    font: 600 15px var(--body); border: 0; border-radius: 4px; cursor: pointer;
    background: var(--ink); color: var(--bg); padding: 10px 18px;
  }
  button:hover:not(:disabled) { background: var(--mark); color: var(--mark-ink); }
  button:focus-visible { outline: 2px solid var(--mark); outline-offset: 2px; }
  button:disabled { opacity: .45; cursor: default; }
  .msg { margin: 0; font-size: 14px; min-height: 1.5em; color: var(--muted); }
  .msg.err { color: var(--danger); }
  .hp { display: none; }

  #wall { list-style: none; margin: 0; padding: 0; display: grid; }
  .post { padding: 16px 0; border-top: 1px solid var(--line); display: grid; gap: 6px; min-width: 0; }
  .post:first-child { border-top: 0; }
  .meta { display: flex; gap: 10px; align-items: baseline; font: 12px/1.3 var(--mono); color: var(--muted); }
  .meta b { font-weight: 500; color: var(--ink); }
  .meta .no { margin-left: auto; font-variant-numeric: tabular-nums; }
  .body { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 17px; }
  .post.fresh { animation: flash 1.6s ease-out; }
  @keyframes flash { from { background: color-mix(in srgb, var(--mark) 45%, transparent); } to { background: transparent; } }
  @media (prefers-reduced-motion: reduce) { .post.fresh { animation: none; } }

  .empty, .setup { color: var(--muted); padding: 24px 0; }
  .setup { background: var(--surface); border: 1px dashed var(--line); border-radius: 6px; padding: 16px; color: var(--ink); }
  .setup code { font: 13px var(--mono); background: var(--bg); padding: 1px 4px; border-radius: 3px; }
  #more { justify-self: center; background: transparent; color: var(--ink); border: 1px solid var(--line); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><span>Стенка</span></h1>
    <p class="tagline">Пиши что хочешь. Видят все. Без регистрации.</p>
    <div class="stats" id="stats">загрузка…</div>
  </header>

  <form id="form" autocomplete="off">
    <label class="sr" for="nick">Ник</label>
    <input id="nick" maxlength="32" placeholder="аноним">
    <label class="sr" for="text">Пост</label>
    <textarea id="text" maxlength="600" placeholder="Что на уме?"></textarea>
    <input class="hp" id="website" tabindex="-1" aria-hidden="true">
    <div class="row">
      <span class="count" id="count">0 / 500</span>
      <button type="submit" id="send" disabled>Написать на стене</button>
    </div>
    <p class="msg" id="msg" role="status"></p>
  </form>

  <ol id="wall" aria-live="polite"></ol>
  <button id="more" hidden>Показать старые</button>
</div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(() => {
  const MAX = 500, PAGE = 50, COOLDOWN_MS = 15000;
  const $ = (id) => document.getElementById(id);
  const form = $("form"), nick = $("nick"), text = $("text"), send = $("send");
  const count = $("count"), msg = $("msg"), wall = $("wall"), more = $("more"), stats = $("stats");
  const cfg = window.STENKA_CONFIG || {};
  const seen = new Set();
  let oldest = null, lastSent = 0, sb = null;

  const store = {
    get(k) { try { return localStorage.getItem(k) || ""; } catch { return ""; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  };
  nick.value = store.get("stenka-nick");

  function say(t, err = false) { msg.textContent = t; msg.classList.toggle("err", err); }

  function ago(iso) {
    const s = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000);
    if (s < 45) return "только что";
    if (s < 3600) return Math.round(s / 60) + " мин назад";
    if (s < 86400) return Math.round(s / 3600) + " ч назад";
    return new Date(iso).toLocaleDateString("ru-RU", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
  }

  function render(p, { top = false, fresh = false } = {}) {
    if (seen.has(p.id)) return;
    seen.add(p.id);
    wall.querySelector(".empty")?.remove();
    const li = document.createElement("li");
    li.className = "post" + (fresh ? " fresh" : "");
    const meta = document.createElement("div"); meta.className = "meta";
    const who = document.createElement("b"); who.textContent = p.nick || "аноним";
    const when = document.createElement("time"); when.dateTime = p.created_at; when.textContent = ago(p.created_at);
    const no = document.createElement("span"); no.className = "no"; no.textContent = "#" + p.id;
    meta.append(who, when, no);
    const body = document.createElement("p"); body.className = "body"; body.textContent = p.body;
    li.append(meta, body);
    top ? wall.prepend(li) : wall.append(li);
    if (!oldest || p.id < oldest) oldest = p.id;
  }

  function updateCount() {
    const n = text.value.trim().length;
    count.textContent = n + " / " + MAX;
    count.classList.toggle("over", n > MAX);
    send.disabled = !sb || n === 0 || n > MAX;
  }

  async function updateStats() {
    const { count: c } = await sb.from("posts").select("id", { count: "exact", head: true });
    if (typeof c === "number") stats.textContent = c + " " + plural(c, ["пост", "поста", "постов"]) + " на стене";
  }
  function plural(n, f) { const a = n % 100, b = n % 10; return a > 10 && a < 20 ? f[2] : b === 1 ? f[0] : b > 1 && b < 5 ? f[1] : f[2]; }

  async function load() {
    let q = sb.from("posts").select("*").order("id", { ascending: false }).limit(PAGE);
    if (oldest) q = q.lt("id", oldest);
    const { data, error } = await q;
    if (error) { say("Не получилось загрузить посты: " + error.message, true); return; }
    data.forEach((p) => render(p));
    more.hidden = data.length < PAGE;
    if (!wall.children.length) {
      const li = document.createElement("li"); li.className = "empty";
      li.textContent = "Пока пусто. Напиши первым.";
      wall.append(li);
    }
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    if ($("website").value) return;                 // бот заполнил скрытое поле
    const body = text.value.trim();
    if (!body || body.length > MAX) return;
    const wait = COOLDOWN_MS - (Date.now() - lastSent);
    if (wait > 0) { say("Подожди ещё " + Math.ceil(wait / 1000) + " с.", true); return; }
    send.disabled = true; say("Отправляю…");
    store.set("stenka-nick", nick.value.trim());
    const { data, error } = await sb.from("posts").insert({ nick: nick.value.trim().slice(0, 32), body }).select().single();
    if (error) { say(error.message.includes("Слишком") ? "Стена перегружена, попробуй через минуту." : "Не отправилось: " + error.message, true); updateCount(); return; }
    lastSent = Date.now();
    text.value = ""; updateCount(); say("Готово, пост на стене.");
    render(data, { top: true, fresh: true }); updateStats();
  });

  text.addEventListener("input", updateCount);
  text.addEventListener("keydown", (e) => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) form.requestSubmit(); });
  more.addEventListener("click", load);
  setInterval(() => wall.querySelectorAll("time").forEach((t) => (t.textContent = ago(t.dateTime))), 30000);

  if (!cfg.url || !cfg.anonKey || !window.supabase) {
    stats.textContent = "не подключено";
    const li = document.createElement("li"); li.className = "setup";
    li.innerHTML = "Стенка ещё не подключена к базе. Создай проект в Supabase, выполни <code>supabase/schema.sql</code> и впиши URL и anon-ключ в <code>config.js</code>. Подробнее в README.";
    wall.append(li);
    updateCount();
    return;
  }

  sb = window.supabase.createClient(cfg.url, cfg.anonKey);
  updateCount();
  load().then(updateStats);
  sb.channel("posts")
    .on("postgres_changes", { event: "INSERT", schema: "public", table: "posts" }, (payload) => {
      render(payload.new, { top: true, fresh: true }); updateStats();
    })
    .on("postgres_changes", { event: "DELETE", schema: "public", table: "posts" }, () => updateStats())
    .subscribe();
})();
</script>
</body>
</html>
